name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 👈 这里从 3.10 改成了 3.11

      - name: Install dependencies
        run: |
          pip install pyinstaller websockets apinator-server requests pystray pillow pygame edge-tts

      - name: Build teacher.exe
        run: pyinstaller -F -w teacher.py

      - name: Build screen.exe
        run: pyinstaller -F -w --collect-all edge_tts --collect-all pygame --collect-all pystray screen.py

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: shout-exe
          path: |
            dist/teacher.exe
            dist/screen.exe
